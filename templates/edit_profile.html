<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

.container{

width:90%;
max-width:600px;
margin:50px auto;

}

.card{

background:white;
padding:35px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.08);

}

h2{

text-align:center;
margin-bottom:25px;

}

label{

display:block;
margin-top:15px;
margin-bottom:6px;
font-weight:bold;

}

input{

width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;

}

button{

margin-top:25px;
width:100%;
padding:14px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:16px;

}

button:hover{

background:#1e40af;

}

.cancel{

display:block;
margin-top:15px;
text-align:center;
text-decoration:none;
color:#444;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2>Edit Profile</h2>

<form method="POST">

<label>Username</label>

<input
type="text"
value="{{ user.username }}"
readonly>

<label>Email</label>

<input
type="email"
name="email"
value="{{ user.email }}"
required>

<button type="submit">

Save Changes

</button>

</form>

<a
href="{{ url_for('profile') }}"
class="cancel">

Cancel

</a>

</div>

</div>

</body>

</html>
