<!DOCTYPE html>
<html>
<head>
    <title>Login Activity</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f6f9;
        }

        .navbar{
            background:#111827;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .navbar a:hover{
            color:#60a5fa;
        }

        .container{
            width:95%;
            margin:auto;
            margin-top:30px;
        }

        h1{
            text-align:center;
            color:#111827;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        th{
            background:#111827;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #ddd;
            text-align:center;
        }

        tr:hover{
            background:#f3f4f6;
        }

        .success{
            color:green;
            font-weight:bold;
        }

        .failed{
            color:red;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="navbar">

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('manage_users') }}">
            Users
        </a>

        <a href="{{ url_for('live_threats') }}">
            Live Threat Feed
        </a>

        <a href="{{ url_for('activities') }}">
            Activities
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

    <div class="container">

        <h1>Login Activity Logs</h1>

        <table>

            <tr>
                <th>Username</th>
                <th>Status</th>
                <th>Reason</th>
                <th>IP Address</th>
                <th>Timestamp</th>
            </tr>

            {% for log in logs %}

            <tr>

                <td>{{ log.username }}</td>

                <td>

                    {% if log.status == "SUCCESS" %}
                        <span class="success">
                            SUCCESS
                        </span>
                    {% else %}
                        <span class="failed">
                            FAILED
                        </span>
                    {% endif %}

                </td>

                <td>{{ log.reason }}</td>
                <td>{{ log.ip_address }}</td>
                <td>{{ log.timestamp }}</td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>
</html>
