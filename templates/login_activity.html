<!DOCTYPE html>
<html>
<head>
    <title>Login Activity</title>

    <style>

        body{
            margin:0;
            font-family:'Segoe UI', Arial, sans-serif;
            background:linear-gradient(135deg, #07111f 0%, #0f172a 45%, #111827 100%);
            color:#e5eefb;
        }

        .navbar{
            background:rgba(2, 8, 23, 0.96);
            padding:15px;
            text-align:center;
            border-bottom:1px solid rgba(96, 165, 250, 0.2);
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .navbar a:hover{
            color:#60a5fa;
        }

        .container{
            width:95%;
            margin:30px auto;
            max-width:1200px;
        }

        h1{
            text-align:center;
            color:#f8fafc;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:rgba(15, 23, 42, 0.92);
            box-shadow:0 14px 30px rgba(2, 8, 23, 0.28);
        }

        th{
            background:#1e293b;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid rgba(148, 163, 184, 0.2);
            text-align:center;
            color:#cbd5e1;
        }

        tr:hover{
            background:rgba(37, 99, 235, 0.08);
        }

        .success{
            color:#4ade80;
            font-weight:bold;
        }

        .failed{
            color:#f87171;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="navbar">

        <a href="{{ url_for('admin_dashboard') }}">
            Dashboard
        </a>

        <a href="{{ url_for('manage_users') }}">
            Users
        </a>

        <a href="{{ url_for('live_threats') }}">
            Live Threat Feed
        </a>

        <a href="{{ url_for('activities') }}">
            Activities
        </a>

        <a href="{{ url_for('logout') }}">
            Logout
        </a>

    </div>

    <div class="container">

        <h1>Login Activity Logs</h1>

        <table>

            <tr>
                <th>Username</th>
                <th>Status</th>
                <th>Reason</th>
                <th>IP Address</th>
                <th>Timestamp</th>
            </tr>

            {% for log in logs %}

            <tr>

                <td>{{ log.username }}</td>

                <td>

                    {% if log.status == "SUCCESS" %}
                        <span class="success">
                            SUCCESS
                        </span>
                    {% else %}
                        <span class="failed">
                            FAILED
                        </span>
                    {% endif %}

                </td>

                <td>{{ log.reason }}</td>
                <td>{{ log.ip_address }}</td>
                <td>{{ log.timestamp }}</td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>
</html>
