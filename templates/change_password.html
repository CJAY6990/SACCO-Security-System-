<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:100%;
            max-width:450px;
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        h2{
            color:#1f2937;
            margin-bottom:25px;
        }

        .error{
            background:#fee2e2;
            color:#b91c1c;
            padding:10px;
            border-radius:6px;
            margin-bottom:20px;
        }

        .success{
            background:#dcfce7;
            color:#166534;
            padding:10px;
            border-radius:6px;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #d1d5db;
            border-radius:6px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
            font-weight:bold;
        }

        button:hover{
            background:#1d4ed8;
        }

        .back-link{
            display:block;
            margin-top:20px;
            text-decoration:none;
            color:#2563eb;
            font-weight:bold;
        }

    </style>
</head>
<body>

    <div class="container">

        <h2>Change Password</h2>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="success">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input
                type="password"
                name="current_password"
                placeholder="Current Password"
                required
            >

            <input
                type="password"
                name="new_password"
                placeholder="New Password"
                required
            >

            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm New Password"
                required
            >

            <button type="submit">
                Change Password
            </button>

        </form>

        <a class="back-link"
           href="{{ url_for('dashboard') }}">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
