<!DOCTYPE html>
<html>
<head>
    <title>SACCO Security Dashboard</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f6f9;
        }

        /* HEADER */
        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            margin: 0;
        }

        .logout-btn {
            background: red;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
        }

        /* CONTAINER */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        /* CARDS */
        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            width: 220px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* NAVIGATION */
        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .nav a {
            background: #1f2937;
            color: white;
            padding: 12px 18px;
            text-decoration: none;
            border-radius: 6px;
        }

        .nav a:hover {
            background: #111827;
        }

        /* STATUS */
        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }

        .safe { color: green; }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>SACCO SECURITY CONTROL CENTER</h2>
    <a class="logout-btn" href="/logout">Logout</a>
</div>

<!-- MAIN -->
<div class="container">

    <!-- STATUS -->
    <div class="status">
        Security Status: <span class="safe">SYSTEM SAFE</span>
    </div>

    <!-- CARDS -->
    <div class="cards">

        <div class="card">
            <h3>Total Logs</h3>
            <h2>{{ total_logs }}</h2>
        </div>

        <div class="card">
            <h3>Total Alerts</h3>
            <h2>{{ total_alerts }}</h2>
        </div>

        <div class="card">
            <h3>Active User</h3>
            <h2>{{ member_id }}</h2>
        </div>

    </div>

    <!-- NAVIGATION -->
    <div class="nav">

        <a href="/logs">Login Activity</a>

        <a href="/alerts">Security Alerts</a>

        <a href="/admin">Admin Panel</a>

    </div>

</div>

</body>
</html>
