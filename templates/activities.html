<!DOCTYPE html>
<html>
<head>
    <title>System Activity Logs</title>
    

    <style>
        body{
            font-family:'Segoe UI', Arial, sans-serif;
            background:linear-gradient(135deg, #07111f 0%, #0f172a 45%, #111827 100%);
            color:#e5eefb;
            margin:0;
        }

        .container{
            width:95%;
            margin:30px auto;
            max-width:1200px;
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .search-box{
            margin-bottom:20px;
            background:rgba(15, 23, 42, 0.9);
            padding:15px;
            border-radius:12px;
            box-shadow:0 12px 30px rgba(2, 8, 23, 0.28);
            border:1px solid rgba(96, 165, 250, 0.2);
        }

        .search-box input{
            width:320px;
            padding:10px;
            border:1px solid rgba(96, 165, 250, 0.3);
            border-radius:8px;
            background:rgba(15, 23, 42, 0.8);
            color:#f8fafc;
        }

        .search-box button{
            padding:10px 15px;
            border:none;
            background:linear-gradient(135deg, #2563eb, #3b82f6);
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:rgba(15, 23, 42, 0.92);
            box-shadow:0 14px 30px rgba(2, 8, 23, 0.28);
            border-radius:14px;
            overflow:hidden;
        }

        th{
            background:#1e293b;
            color:#e2e8f0;
            padding:12px;
        }

        td{
            padding:10px;
            border-bottom:1px solid rgba(148, 163, 184, 0.2);
            color:#cbd5e1;
        }

        tr:hover{
            background:rgba(37, 99, 235, 0.08);
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>System Activity Logs</h1>
    </div>

    <!-- SEARCH BAR AT THE TOP -->
    <div class="search-box">

        <form method="GET"
              action="{{ url_for('activities') }}">

            <input
                type="text"
                name="search"
                placeholder="Search by username, activity or IP..."
                value="{{ request.args.get('search', '') }}"
            >

            <button type="submit">Search</button>

        </form>

    </div>

    <!-- ACTIVITIES TABLE -->
    <table>

        <tr>
            <th>User</th>
            <th>Activity</th>
            <th>IP Address</th>
            <th>Time</th>
        </tr>

        {% for activity in activities %}
        <tr>
            <td>{{ activity.username }}</td>
            <td>{{ activity.action }}</td>
            <td>{{ activity.ip_address }}</td>
            <td>{{ activity.timestamp|kenya_time }}</td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
