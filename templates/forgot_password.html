<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Forgot Password</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:#1e293b;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 20px rgba(0,0,0,.35);
        }

        h2{
            color:white;
            text-align:center;
            margin-bottom:15px;
        }

        p{
            color:#cbd5e1;
            text-align:center;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:18px;
            border:none;
            border-radius:6px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .error{
            background:#dc2626;
            color:white;
            padding:10px;
            border-radius:6px;
            text-align:center;
            margin-bottom:15px;
        }

        .flash{
            background:#16a34a;
            color:white;
            padding:10px;
            border-radius:6px;
            text-align:center;
            margin-bottom:15px;
        }

        .links{
            text-align:center;
            margin-top:20px;
        }

        .links a{
            color:#60a5fa;
            text-decoration:none;
        }

        .links a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Forgot Password</h2>

    <p>

        Enter your registered email address.

        <br>

        We will send you a verification code.

    </p>

    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="flash">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Registered Email"
            required
        >

        <button type="submit">

            Send Verification Code

        </button>

    </form>

    <div class="links">

        <a href="{{ url_for('login') }}">

            Back to Login

        </a>

    </div>

</div>

</body>

</html>
