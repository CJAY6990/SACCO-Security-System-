<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SACCO Security Login</title>


    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        } 

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #219150;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .note {
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>SACCO SECURITY LOGIN</h2>

    <form method="POST" action="/">

        <input type="text" name="member_id" placeholder="Member ID" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login Securely</button>

    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="note">
        Unauthorized access is monitored and logged
    </div>

</div>

</body>
</html>
