<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | Security Monitoring System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#0f172a;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            width:380px;
            background:#1e293b;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 25px rgba(0,0,0,.35);
        }

        h2{
            text-align:center;
            color:#fff;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:6px;
            outline:none;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:#fff;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .error{
            background:#dc2626;
            color:#fff;
            padding:10px;
            border-radius:6px;
            margin-bottom:15px;
            text-align:center;
        }

        .flash{
            background:#16a34a;
            color:#fff;
            padding:10px;
            border-radius:6px;
            margin-bottom:15px;
            text-align:center;
        }

        .links{
            margin-top:20px;
            text-align:center;
        }

        .links a{
            display:block;
            margin:10px 0;
            color:#60a5fa;
            text-decoration:none;
        }

        .links a:hover{
            text-decoration:underline;
        }

        .demo-link{
            display:block;
            margin-top:12px;
            color:#93c5fd;
            text-decoration:none;
            font-weight:600;
        }

        .demo-link:hover{
            text-decoration:underline;
        }

        .page-loader{
            position:fixed;
            inset:0;
            background:rgba(2, 8, 23, 0.8);
            display:none;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:12px;
            z-index:99999;
            color:white;
        }

        .spinner{
            width:44px;
            height:44px;
            border:4px solid rgba(255,255,255,0.25);
            border-top-color:#60a5fa;
            border-radius:50%;
            animation:spin 0.9s linear infinite;
        }

        @keyframes spin{
            to{ transform:rotate(360deg); }
        }
    </style>
</head>

<body>

<div id="page-loader" class="page-loader" aria-live="polite">
    <div class="spinner"></div>
    <p>Authenticating...</p>
</div>

<div class="login-box">

    <h2>Secure Login</h2>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="flash">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="links">

        <a href="{{ url_for('signup') }}">
            Create Account
        </a>

        <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>

        <a class="demo-link" href="{{ url_for('demo_dashboard') }}">
            Browse Demo Dashboard
        </a>

    </div>

</div>

<script>
const loader = document.getElementById("page-loader");
const form = document.querySelector("form");
const demoLink = document.querySelector(".demo-link");

function showLoader() {
    if (loader) {
        loader.style.display = "flex";
    }
}

function hideLoader() {
    if (loader) {
        loader.style.display = "none";
    }
}

window.addEventListener("pageshow", hideLoader);
window.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
        hideLoader();
    }
});
window.addEventListener("beforeunload", () => {
    showLoader();
});

if (form) {
    form.addEventListener("submit", () => {
        showLoader();
    });
}

document.querySelectorAll("a[href]:not([href^='#'])").forEach((link) => {
    link.addEventListener("click", () => {
        showLoader();
    });
});

if (demoLink) {
    demoLink.addEventListener("click", () => {
        showLoader();
    });
}
</script>

</body>
</html>
