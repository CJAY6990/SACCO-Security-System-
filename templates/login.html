<!DOCTYPE html>
<html>
<head>
    <title>Login - SACCO Security</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            margin: 0;

            /* CENTERING */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1f2937;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #111827;
        }

        .error {
            color: red;
            margin-bottom: 10px;
        }

        a {
            display: block;
            margin-top: 10px;
            color: #1f2937;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>SECURITY LOGIN</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">

        <input type="text" name="member_id" placeholder="Member ID" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <a href="/signup">Create Account</a>

</div>

</body>
</html>
