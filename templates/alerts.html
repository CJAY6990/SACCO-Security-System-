<!DOCTYPE html>
<html>
<head>
    <title>Security Alerts</title>

    <style>
        body {
            font-family:'Segoe UI', Arial, sans-serif;
            background:linear-gradient(135deg, #07111f 0%, #0f172a 45%, #111827 100%);
            margin: 0;
            color:#e5eefb;
        }

        .header {
            background:rgba(2, 8, 23, 0.96);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom:1px solid rgba(96, 165, 250, 0.2);
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            background:rgba(15, 23, 42, 0.92);
            border-collapse: collapse;
            margin-top: 20px;
            box-shadow:0 14px 30px rgba(2, 8, 23, 0.28);
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            text-align: center;
            color:#cbd5e1;
        }

        th {
            background:#1e293b;
            color: white;
        }

        .back {
            margin-top: 20px;
            display: inline-block;
            padding: 10px 14px;
            background:linear-gradient(135deg, #dc2626, #ef4444);
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>SECURITY ALERTS</h2>
</div>

<div class="container">

    <table>
        <tr>
            <th>Type</th>
            <th>Member</th>
            <th>Details</th>
            <th>Time</th>
        </tr>

        {% for a in alerts %}
        <tr>
            <td>{{ a.alert_type }}</td>
            <td>{{ a.member_id }}</td>
            <td>{{ a.details }}</td>
            <td>{{ a.timestamp }}</td>
        </tr>
        {% endfor %}
    </table>

    <a class="back" href="/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
